[project]
name = "gridbot-monitor"
version = "0.1.0"
description = "Binance Grid Trading Bot Monitor with Gemini AI Analysis"
requires-python = ">=3.11"
dependencies = [
    "python-binance>=1.0.20",
    "google-genai>=1.0.0",
    "python-telegram-bot>=21.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "APScheduler>=3.10.4,<4.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
