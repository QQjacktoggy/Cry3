# Logrotate configuration for Cry3 bot
# Rotates /home/jack_shih/cry3_manual.log daily, keeps 14 days

/home/jack_shih/cry3_manual.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 jack_shih jack_shih
    sharedscripts
    postrotate
        # Send SIGHUP to bot process to reopen log file
        systemctl reload cry3 > /dev/null 2>&1 || true
    endscript
}
